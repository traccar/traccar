services:
  traccar:
    build:
      context: .
      dockerfile: Dockerfile.base44
    restart: unless-stopped
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.h2.Driver
      DATABASE_URL: jdbc:h2:/opt/traccar/data/database
      DATABASE_USER: sa
      DATABASE_PASSWORD: ""
      REGISTRATION: "true"
    ports:
      - "3000:8082"
      - "5264:5264"
    volumes:
      - .:/source
      - traccar-data:/opt/traccar/data
      - traccar-logs:/opt/traccar/logs
      - gradle-cache:/root/.gradle
    command: >
      bash -c "
        cd /source &&
        ./gradlew jar copyRuntimeLibs --init-script /init.gradle &&
        cp target/tracker-server.jar /opt/traccar/tracker-server.jar &&
        cd /opt/traccar &&
        java -XX:+ExitOnOutOfMemoryError -jar tracker-server.jar conf/traccar.xml
      "

volumes:
  traccar-data:
  traccar-logs:
  gradle-cache:
